<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kayıt Ol - Merkez Oto Anahtar</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .auth-page {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 15% 50%, rgba(230,57,70,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 20%, rgba(37,99,235,0.06) 0%, transparent 45%);
    }
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      animation: fadeUp .5s ease both;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--red), var(--blue-mid));
    }
    .auth-header {
      padding: 36px 40px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .auth-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 20px;
    }
    .auth-logo svg { filter: drop-shadow(0 0 10px rgba(245,166,35,0.6)); }
    .auth-logo-text h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--white); text-transform: uppercase; letter-spacing: 1px;
    }
    .auth-logo-text span { font-size: 11px; color: var(--blue-light); letter-spacing: 2px; text-transform: uppercase; }
    .auth-title { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: var(--white); margin-bottom: 6px; }
    .auth-subtitle { font-size: 13px; color: var(--muted); }
    .auth-body { padding: 32px 40px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .input-group { margin-bottom: 18px; }
    .input-group label {
      display: block; font-size: 11px; font-weight: 700;
      color: #9ca3af; margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: .8px;
    }
    .input-wrap { position: relative; }
    .input-wrap .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 16px;
      color: var(--muted); pointer-events: none;
    }
    .input-wrap input {
      width: 100%; padding: 12px 14px 12px 42px;
      background: var(--bg3); border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 14px; color: var(--text);
      outline: none; transition: var(--trans); font-family: inherit;
    }
    .input-wrap input:focus { border-color: var(--blue-mid); background: var(--card2); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap .toggle-pw {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); cursor: pointer;
      color: var(--muted); font-size: 16px; background: none; border: none;
      transition: var(--trans);
    }
    .input-wrap .toggle-pw:hover { color: var(--text); }
    .pw-strength { margin-top: 6px; }
    .pw-bar { height: 3px; border-radius: 3px; background: var(--bg3); overflow: hidden; }
    .pw-bar-fill { height: 100%; width: 0; border-radius: 3px; transition: all .3s ease; }
    .pw-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .auth-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      transition: var(--trans);
      box-shadow: 0 4px 20px var(--red-glow);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
    }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--red-glow); }
    .auth-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .auth-footer {
      padding: 20px 40px 28px;
      text-align: center;
      font-size: 13px; color: var(--muted);
    }
    .auth-footer a { color: var(--blue-light); font-weight: 600; transition: var(--trans); }
    .auth-footer a:hover { color: var(--white); }
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--muted); font-size: 12px;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      color: #f87171; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; display: none;
      animation: fadeIn .3s ease;
    }
    .success-msg {
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25);
      color: #4ade80; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .terms-check {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 13px; color: var(--muted); margin-bottom: 16px;
    }
    .terms-check input { width: 16px; height: 16px; accent-color: var(--red); margin-top: 2px; flex-shrink: 0; }
    @media (max-width: 520px) {
      .auth-body, .auth-header, .auth-footer { padding-left: 24px; padding-right: 24px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="auth-page">

<!-- HEADER -->
<header class="header">
  <div class="container">
    <a class="logo" href="/">
      <div class="logo-icon">
        <svg width="36" height="36" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="14" stroke="#f5a623" stroke-width="5" fill="none"/>
          <circle cx="20" cy="20" r="6" fill="#f5a623"/>
          <rect x="32" y="17" width="24" height="6" rx="3" fill="#f5a623"/>
          <rect x="50" y="23" width="6" height="9" rx="2.5" fill="#f5a623"/>
          <rect x="41" y="23" width="5" height="7" rx="2" fill="#f5a623"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>MERKEZ <span>OTO</span> ANAHTAR</h1>
        <p>Anahtar &amp; Kumanda Uzmanı</p>
      </div>
    </a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-title">Hesap Oluştur</div>
      <div class="auth-subtitle">Üye olarak 3D güvenli ödeme yapabilirsiniz</div>
    </div>

    <div class="auth-body">
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <form id="registerForm" onsubmit="doRegister(event)">
        <div class="form-row">
          <div class="input-group">
            <label>Ad Soyad *</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input type="text" id="regName" placeholder="Ali Yılmaz" required/>
            </div>
          </div>
          <div class="input-group">
            <label>Telefon</label>
            <div class="input-wrap">
              <span class="input-icon">📱</span>
              <input type="tel" id="regPhone" placeholder="05xx xxx xx xx"/>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>E-posta Adresi *</label>
          <div class="input-wrap">
            <span class="input-icon">📧</span>
            <input type="email" id="regEmail" placeholder="ornek@mail.com" required/>
          </div>
        </div>

        <div class="input-group">
          <label>Şifre * (en az 6 karakter)</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" placeholder="••••••••" required oninput="checkPwStrength(this.value)"/>
            <button type="button" class="toggle-pw" onclick="togglePw('regPassword',this)">👁</button>
          </div>
          <div class="pw-strength">
            <div class="pw-bar"><div class="pw-bar-fill" id="pwBar"></div></div>
            <div class="pw-label" id="pwLabel">Şifre girin</div>
          </div>
        </div>

        <div class="input-group">
          <label>Şifre Tekrar *</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword2" placeholder="••••••••" required/>
            <button type="button" class="toggle-pw" onclick="togglePw('regPassword2',this)">👁</button>
          </div>
        </div>

        <div class="terms-check">
          <input type="checkbox" id="termsCheck" required/>
          <label for="termsCheck">
            Üye olarak <a href="#" style="color:var(--blue-light);">kullanım şartlarını</a> ve
            <a href="#" style="color:var(--blue-light);">gizlilik politikasını</a> kabul ediyorum.
          </label>
        </div>

        <button type="submit" class="auth-btn" id="registerBtn">
          <span>🚀</span> Kayıt Ol
        </button>

        <div style="display:flex;align-items:center;gap:12px;margin:18px 0 0;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          <span style="font-size:12px;color:var(--muted);">veya</span>
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>

        <a href="/auth/google" class="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Google ile Kayıt Ol
        </a>
      </form>
    </div>

    <div class="auth-footer">
      Zaten hesabın var mı?
      <a href="/giris">Giriş Yap →</a>
    </div>

  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

function checkPwStrength(val) {
  const bar   = document.getElementById('pwBar');
  const label = document.getElementById('pwLabel');
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const configs = [
    { w: '0%',   color: 'transparent', text: 'Şifre girin' },
    { w: '25%',  color: '#ef4444',     text: 'Çok zayıf' },
    { w: '50%',  color: '#f97316',     text: 'Zayıf' },
    { w: '75%',  color: '#eab308',     text: 'Orta' },
    { w: '90%',  color: '#22c55e',     text: 'Güçlü' },
    { w: '100%', color: '#16a34a',     text: 'Çok güçlü 💪' },
  ];
  const c = configs[Math.min(score, 5)];
  bar.style.width = c.w;
  bar.style.background = c.color;
  label.textContent = c.text;
  label.style.color = c.color === 'transparent' ? 'var(--muted)' : c.color;
}

async function doRegister(e) {
  e.preventDefault();
  const btn    = document.getElementById('registerBtn');
  const errEl  = document.getElementById('errorMsg');
  const succEl = document.getElementById('successMsg');
  errEl.style.display  = 'none';
  succEl.style.display = 'none';

  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pw    = document.getElementById('regPassword').value;
  const pw2   = document.getElementById('regPassword2').value;

  if (pw !== pw2) {
    errEl.textContent = 'Şifreler eşleşmiyor.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> Kayıt oluşturuluyor...';

  const res  = await fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, email, password: pw, phone })
  });
  const data = await res.json();

  if (data.success) {
    // Kayıt başarılı - login sayfasına yönlendir
    succEl.textContent = '✅ Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...';
    succEl.style.display = 'block';
    setTimeout(() => {
      // Login sayfasına git, kayıtlı email'i otomatik doldur
      window.location.href = '/login?email=' + encodeURIComponent(email);
    }, 1500);
  } else {
    errEl.textContent = data.error || 'Kayıt olunamadı.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<span>🚀</span> Kayıt Ol';
  }
}
</script>
<script src="/lang.js"></script>
<script src="/mobile-header.js"></script>
<script src="/wa-support.js"></script>
</body>
</html>
