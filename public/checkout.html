<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sipariş Ver - Merkez Oto Anahtar</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .checkout-layout { display:grid; grid-template-columns:1fr 380px; gap:24px; margin:20px 0 60px; align-items:flex-start; }
    .checkout-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:20px; animation:fadeUp .4s ease both; }
    .checkout-card-header { padding:14px 22px; border-bottom:1px solid var(--border); background:linear-gradient(90deg,rgba(230,57,70,0.05),transparent); }
    .checkout-card-header h3 { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--white); text-transform:uppercase; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
    .checkout-card-body { padding:22px; }
    .form-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .fg { margin-bottom:0; }
    .fg label { display:block; font-size:11px; font-weight:700; color:#9ca3af; margin-bottom:6px; text-transform:uppercase; letter-spacing:.8px; }
    .fg input, .fg select, .fg textarea {
      width:100%; padding:11px 14px;
      background:var(--bg3); border:1.5px solid var(--border);
      border-radius:9px; font-size:14px; color:var(--text);
      outline:none; transition:var(--trans); font-family:inherit;
    }
    .fg input:focus,.fg select:focus { border-color:var(--blue-mid); background:var(--card2); }
    .fg input::placeholder { color:var(--muted); }
    .full { grid-column:1/-1; }

    /* Adres kayıt butonu */
    .use-saved-addr {
      display:flex; align-items:center; gap:8px;
      background:rgba(37,99,235,0.06); border:1px solid rgba(37,99,235,0.15);
      border-radius:8px; padding:10px 14px; margin-bottom:16px;
      font-size:13px; color:var(--muted); cursor:pointer;
      transition:var(--trans);
    }
    .use-saved-addr:hover { border-color:var(--blue-mid); color:var(--blue-light); }

    /* Özet sağ panel */
    .order-summary { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; position:sticky; top:80px; animation:fadeUp .4s .1s ease both; position:relative; }
    .order-summary::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--red),var(--blue-mid)); }
    .os-header { padding:14px 20px; border-bottom:1px solid var(--border); background:linear-gradient(90deg,rgba(230,57,70,0.05),transparent); }
    .os-header h3 { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--white); text-transform:uppercase; letter-spacing:.5px; }
    .os-body { padding:18px 20px; }
    .os-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
    .os-item:last-of-type { border-bottom:none; }
    .os-item-img { width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--bg3); border:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .os-item-info { flex:1; min-width:0; }
    .os-item-name { font-size:13px; font-weight:600; color:var(--white); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .os-item-qty { font-size:11px; color:var(--muted); margin-top:2px; }
    .os-item-price { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--white); flex-shrink:0; }
    .os-divider { height:1px; background:var(--border); margin:12px 0; }
    .os-row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px; }
    .os-row.total { font-size:17px; font-weight:800; color:var(--white); margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
    .os-row .val { color:var(--text); font-weight:600; }
    .os-row.total .val { color:var(--white); font-family:'Rajdhani',sans-serif; font-size:20px; }
    .place-order-btn {
      width:100%; padding:15px;
      background:linear-gradient(135deg,var(--red),var(--red-dark));
      color:#fff; border:none; border-radius:10px;
      font-size:15px; font-weight:700; font-family:inherit;
      cursor:pointer; transition:var(--trans);
      box-shadow:0 4px 20px var(--red-glow);
      display:flex; align-items:center; justify-content:center; gap:8px;
      margin-top:18px;
    }
    .place-order-btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px var(--red-glow); }
    .place-order-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .security-note { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:12px; justify-content:center; }

    /* Adım göstergesi */
    .checkout-steps { display:flex; align-items:center; gap:0; margin-bottom:28px; }
    .step { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
    .step.active { color:var(--white); font-weight:700; }
    .step.done { color:var(--green); }
    .step-num { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:2px solid var(--border); flex-shrink:0; }
    .step.active .step-num { background:var(--red); border-color:var(--red); color:#fff; }
    .step.done .step-num { background:rgba(34,197,94,0.15); border-color:#4ade80; color:#4ade80; }
    .step-sep { flex:1; height:1px; background:var(--border); margin:0 8px; max-width:40px; }

    /* Ödeme yöntemi */
    .payment-methods { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px; }
    .payment-method {
      padding:14px 16px; background:var(--bg3);
      border:2px solid var(--border); border-radius:10px;
      cursor:pointer; transition:var(--trans);
      text-align:center;
    }
    .payment-method:hover { border-color:var(--blue-mid); }
    .payment-method.selected { border-color:var(--red); background:rgba(230,57,70,0.06); }
    .payment-method .pm-icon { font-size:26px; margin-bottom:6px; }
    .payment-method .pm-name { font-size:13px; font-weight:700; color:var(--white); display:block; }
    .payment-method .pm-desc { font-size:11px; color:var(--muted); margin-top:2px; }
    .iyzico-note { background:rgba(37,99,235,0.06); border:1px solid rgba(37,99,235,0.15); border-radius:8px; padding:10px 14px; font-size:12px; color:var(--muted); margin-top:10px; display:none; }

    @media(max-width:900px) { .checkout-layout { grid-template-columns:1fr; } .order-summary { position:relative; top:0; } }
    @media(max-width:600px) { .form-grid2 { grid-template-columns:1fr; } .payment-methods { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="topbar"><div class="container">
  <div class="topbar-info"><span class="topbar-clock">🕐 <span id="topClock">--:--:--</span></span></div>
  <a href="https://wa.me/905386470132" target="_blank" style="color:#25D366;font-weight:700;font-size:12px;">💬 WhatsApp</a>
</div></div>

<header class="header"><div class="container">
  <a class="logo" href="/">
    <div class="logo-icon"><svg width="36" height="36" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="14" stroke="#f5a623" stroke-width="5" fill="none"/><circle cx="20" cy="20" r="6" fill="#f5a623"/><rect x="32" y="17" width="24" height="6" rx="3" fill="#f5a623"/><rect x="50" y="23" width="6" height="9" rx="2.5" fill="#f5a623"/><rect x="41" y="23" width="5" height="7" rx="2" fill="#f5a623"/></svg></div>
    <div class="logo-text"><h1>MERKEZ <span>OTO</span> ANAHTAR</h1><p>Anahtar &amp; Kumanda Uzmanı</p></div>
  </a>
  <div class="header-actions" id="headerActions"></div>
</div></header>

<main><div class="container">
  <div class="breadcrumb">
    <a href="/">Ana Sayfa</a><span>›</span>
    <a href="/sepet">Sepet</a><span>›</span>
    <span>Sipariş Ver</span>
  </div>

  <!-- ADIM GÖSTERGESİ -->
  <div class="checkout-steps">
    <div class="step done"><div class="step-num">✓</div><span>Sepet</span></div>
    <div class="step-sep"></div>
    <div class="step active"><div class="step-num">2</div><span>Adres & Ödeme</span></div>
    <div class="step-sep"></div>
    <div class="step"><div class="step-num">3</div><span>Onay</span></div>
  </div>

  <div id="checkoutContent">
    <div class="loading"><div class="spinner"></div><p>Yükleniyor...</p></div>
  </div>
</div></main>

<div class="toast-container" id="toastContainer"></div>
<script src="/lang.js"></script>
<script src="/mobile-header.js"></script>
<script src="/app.js"></script>
<script>
let cartItems = [];
let currentUser = null;


let savedAddresses = [];
let selectedAddressId = null;

async function loadSavedAddresses() {
  try {
    const res = await fetch('/api/addresses');
    savedAddresses = await res.json();
  } catch(e) { savedAddresses = []; }
}

function renderSavedAddresses() {
  const el = document.getElementById('savedAddressList');
  if (!el) return;
  if (!savedAddresses.length) {
    // Adres yoksa direkt yeni adres formunu aç
    document.getElementById('newAddrForm').style.display = 'block';
    document.getElementById('newAddrToggleRow').style.display = 'none';
    return;
  }
  el.innerHTML = savedAddresses.map(a => `
    <div onclick="selectSavedAddress(${a.id})" id="addr-card-${a.id}"
      style="padding:14px 16px;background:${a.isDefault || a.id===selectedAddressId?'rgba(230,57,70,0.06)':'var(--bg3)'};
      border:1.5px solid ${a.id===selectedAddressId?'var(--red)':a.isDefault?'rgba(230,57,70,0.3)':'var(--border)'};
      border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:14px;">
      <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${a.id===selectedAddressId?'var(--red)':'var(--muted)'};
        display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;">
        ${a.id===selectedAddressId?'<div style="width:10px;height:10px;border-radius:50%;background:var(--red);"></div>':''}
      </div>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:700;color:var(--white);">${a.title||'Adresim'} ${a.isDefault?'<span style="font-size:10px;color:var(--red);font-weight:600;">(Varsayılan)</span>':''}</div>
        <div style="font-size:12px;color:var(--muted);">${a.name} · ${a.phone}</div>
        <div style="font-size:12px;color:var(--muted);">${a.address}${a.district?', '+a.district:''}, ${a.city}</div>
      </div>
    </div>`).join('') +
    `<a href="/hesabim" target="_blank" style="display:block;text-align:center;font-size:12px;color:var(--blue-light);margin-top:4px;margin-bottom:8px;">+ Hesabımdan adres yönet</a>`;

  // Varsayılan adresi seç
  const def = savedAddresses.find(a => a.isDefault) || savedAddresses[0];
  if (def && !selectedAddressId) selectSavedAddress(def.id);
}

function selectSavedAddress(id) {
  selectedAddressId = id;
  // Yeni adres formunu kapat
  document.getElementById('newAddrForm').style.display = 'none';
  document.getElementById('newAddrToggleBtn').textContent = '+ Farklı Adres Gir';
  // Kartları güncelle
  savedAddresses.forEach(a => {
    const card = document.getElementById('addr-card-' + a.id);
    if (card) {
      card.style.border = a.id===id ? '1.5px solid var(--red)' : '1.5px solid var(--border)';
      card.style.background = a.id===id ? 'rgba(230,57,70,0.06)' : 'var(--bg3)';
      const dot = card.querySelector('div');
      dot.style.borderColor = a.id===id ? 'var(--red)' : 'var(--muted)';
      dot.innerHTML = a.id===id ? '<div style="width:10px;height:10px;border-radius:50%;background:var(--red);"></div>' : '';
    }
  });
}

function toggleNewAddrForm() {
  const form = document.getElementById('newAddrForm');
  const btn  = document.getElementById('newAddrToggleBtn');
  const isOpen = form.style.display !== 'none';
  if (isOpen) {
    form.style.display = 'none';
    btn.textContent = savedAddresses.length ? '+ Farklı Adres Gir' : '+ Yeni Adres Gir';
    if (savedAddresses.length) {
      const def = savedAddresses.find(a => a.isDefault) || savedAddresses[0];
      selectSavedAddress(def.id);
    }
  } else {
    form.style.display = 'block';
    selectedAddressId = null;
    btn.textContent = '✕ İptal';
    savedAddresses.forEach(a => {
      const card = document.getElementById('addr-card-' + a.id);
      if (card) { card.style.border = '1.5px solid var(--border)'; card.style.background = 'var(--bg3)'; }
    });
  }
}

async function initCheckout() {
  // Auth kontrol
  const authRes = await fetch('/api/auth/me');
  const auth = await authRes.json();
  if (!auth.loggedIn) { window.location.href = '/giris?redirect=/odeme'; return; }
  currentUser = auth.user;

  // Sepet kontrol
  const cartRes = await fetch('/api/cart');
  const cartData = await cartRes.json();
  if (!cartData.items || cartData.items.length === 0) { window.location.href = '/sepet'; return; }
  cartItems = cartData.items;

  // Kayıtlı adresleri yükle
  await loadSavedAddresses();
  renderCheckout(cartData);
  setTimeout(renderSavedAddresses, 50);
}

let appliedCouponCode = null;
let appliedDiscount   = 0;
let checkoutSubtotal  = 0;
let checkoutShipping  = 0;

function renderCheckout(cartData) {
  const subtotal    = cartData.total;
  checkoutSubtotal  = subtotal;
  checkoutShipping  = subtotal >= 500 ? 0 : 29.90;
  const shippingFee = checkoutShipping;
  const grandTotal  = subtotal + shippingFee;

  document.getElementById('checkoutContent').innerHTML = `
    <div class="checkout-layout">
      <!-- SOL: FORM -->
      <div>
                  <!-- Teslimat Adresi -->
          <div class="checkout-card">
            <div class="checkout-card-header"><h3>📍 Teslimat Adresi</h3></div>
            <div class="checkout-card-body">
              <div id="savedAddressList"></div>
              <div id="newAddrToggleRow" style="margin-top:8px;">
                <button type="button" onclick="toggleNewAddrForm()" id="newAddrToggleBtn"
                  style="width:100%;padding:12px;background:var(--bg3);border:1.5px dashed var(--border);border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">
                  + Yeni Adres Gir
                </button>
              </div>
              <div id="newAddrForm" style="display:none;margin-top:14px;">
                <div class="form-grid2">
                  <div class="fg"><label>Ad Soyad *</label><input type="text" id="addr_name" value="${currentUser.name}"/></div>
                  <div class="fg"><label>Telefon *</label><input type="tel" id="addr_phone" value="${currentUser.phone || ''}" placeholder="05xx xxx xx xx"/></div>
                  <div class="fg full"><label>Adres *</label><input type="text" id="addr_address" placeholder="Mahalle, Cadde, Sokak, No..."/></div>
                  <div class="fg"><label>İl *</label><input type="text" id="addr_city" placeholder="İstanbul"/></div>
                  <div class="fg"><label>İlçe</label><input type="text" id="addr_district" placeholder="Kadıköy"/></div>
                  <div class="fg"><label>Posta Kodu</label><input type="text" id="addr_zip" placeholder="34000"/></div>
                  <div class="fg full" style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="saveNewAddr" style="width:16px;height:16px;accent-color:var(--red);cursor:pointer;"/>
                    <label for="saveNewAddr" style="font-size:13px;color:var(--muted);cursor:pointer;margin:0;">Bu adresi hesabıma kaydet</label>
                  </div>
                </div>
              </div>
              <div class="fg full" style="margin-top:14px;">
                <label>Sipariş Notu</label>
                <input type="text" id="order_note" placeholder="Kargo görevlisine not (opsiyonel)..."/>
              </div>
            </div>
          </div>

          <!-- Ödeme Yöntemi -->
        <div class="checkout-card">
          <div class="checkout-card-header"><h3>💳 Ödeme Yöntemi</h3></div>
          <div class="checkout-card-body">
            <div style="background:rgba(37,99,235,0.06);border:1px solid rgba(37,99,235,0.2);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:14px;">
              <span style="font-size:28px;">💳</span>
              <div>
                <div style="font-size:14px;font-weight:700;color:var(--white);">Kredi / Banka Kartı — 3D Secure</div>
                <div style="font-size:12px;color:var(--muted);margin-top:3px;">🔒 iyzico altyapısı ile güvenli ödeme. Kart bilgileriniz sitemizde saklanmaz.</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- SAĞ: ÖZET -->
      <div class="order-summary">
        <div class="os-header"><h3>Sipariş Özeti</h3></div>
        <div class="os-body">
          ${cartItems.map(i => `
            <div class="os-item">
              ${i.image ? `<img src="${i.image}" class="os-item-img"/>` : `<div class="os-item-img">🔑</div>`}
              <div class="os-item-info">
                <div class="os-item-name">${i.name}</div>
                <div class="os-item-qty">${i.quantity} adet × ₺${i.price.toFixed(2)}</div>
              </div>
              <div class="os-item-price">₺${(i.price * i.quantity).toLocaleString('tr-TR',{minimumFractionDigits:2})}</div>
            </div>`).join('')}
          <div class="os-divider"></div>
          <div class="os-row"><span>Ara Toplam</span><span class="val">₺${subtotal.toLocaleString('tr-TR',{minimumFractionDigits:2})}</span></div>
          <div class="os-row"><span>Kargo</span><span class="val" style="${shippingFee===0?'color:#4ade80;':''}">${shippingFee===0?'Ücretsiz 🎉':'₺'+shippingFee.toFixed(2)}</span></div>
          <div id="couponDiscountRow" class="os-row" style="display:none;color:#4ade80;"><span>İndirim Kuponu</span><span class="val" id="couponDiscountVal" style="color:#4ade80;"></span></div>
          <div class="os-row total"><span>Toplam</span><span class="val" id="grandTotalVal">₺${grandTotal.toLocaleString('tr-TR',{minimumFractionDigits:2})}</span></div>
          <!-- Kupon Alanı -->
          <div style="margin:14px 0 4px;padding:14px;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);border-radius:10px;">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px;">🎫 İndirim Kuponu</div>
            <div style="display:flex;gap:8px;">
              <input type="text" id="couponInput" placeholder="Kupon kodunuzu girin"
                style="flex:1;padding:9px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);outline:none;font-family:monospace;text-transform:uppercase;letter-spacing:1px;"
                oninput="this.value=this.value.toUpperCase()"/>
              <button onclick="applyCoupon()" id="couponApplyBtn"
                style="padding:9px 16px;background:rgba(230,57,70,0.12);border:1px solid rgba(230,57,70,0.3);border-radius:8px;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;">
                Uygula
              </button>
            </div>
            <div id="couponMsg" style="margin-top:7px;font-size:12px;display:none;"></div>
          </div>
          <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()">
            <span>✅</span> Siparişi Onayla
          </button>
          <div class="security-note"><span>🔒</span> Güvenli Sipariş</div>
          <a href="/sepet" style="display:block;text-align:center;margin-top:10px;font-size:13px;color:var(--muted);">← Sepete Dön</a>
        </div>
      </div>
    </div>`;
}

function fillSavedAddress() {
  if (!currentUser) return;
  document.getElementById('addr_address').value  = currentUser.address  || '';
  document.getElementById('addr_city').value     = currentUser.city     || '';
  document.getElementById('addr_district').value = currentUser.district || '';
  document.getElementById('addr_zip').value      = currentUser.zip      || '';
  document.getElementById('addr_phone').value    = currentUser.phone    || '';
}

async function applyCoupon() {
  const code = document.getElementById('couponInput')?.value?.trim();
  const msg  = document.getElementById('couponMsg');
  const btn  = document.getElementById('couponApplyBtn');
  if (!code) { if(msg){msg.style.display='block';msg.style.color='#f87171';msg.textContent='Kupon kodu girin.';} return; }

  btn.disabled = true; btn.textContent = '...';
  const res  = await fetch('/api/coupons/validate', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ code, cartTotal: checkoutSubtotal })
  });
  const data = await res.json();
  btn.disabled = false; btn.textContent = 'Uygula';

  if (data.success) {
    appliedCouponCode = code;
    appliedDiscount   = data.discountAmount;
    const newTotal    = Math.max(0, checkoutSubtotal + checkoutShipping - appliedDiscount);
    // Satırları güncelle
    const discRow = document.getElementById('couponDiscountRow');
    const discVal = document.getElementById('couponDiscountVal');
    const totalEl = document.getElementById('grandTotalVal');
    if(discRow) discRow.style.display = 'flex';
    if(discVal) discVal.textContent   = '-₺' + appliedDiscount.toLocaleString('tr-TR',{minimumFractionDigits:2});
    if(totalEl) totalEl.textContent   = '₺' + newTotal.toLocaleString('tr-TR',{minimumFractionDigits:2});
    if(msg) { msg.style.display='block'; msg.style.color='#4ade80';
      const c = data.coupon;
      msg.textContent = '✅ Kupon uygulandı! ' + (c.type==='percent'?'%'+c.discount+' indirim':'₺'+c.discount+' indirim') + ' — ' + appliedDiscount.toLocaleString('tr-TR',{minimumFractionDigits:2}) + '₺ kazandınız.';
    }
    document.getElementById('couponInput').disabled = true;
    btn.textContent = '✓ Uygulandı'; btn.style.color = '#4ade80';
  } else {
    appliedCouponCode = null; appliedDiscount = 0;
    if(msg) { msg.style.display='block'; msg.style.color='#f87171'; msg.textContent = '❌ ' + (data.error||'Geçersiz kupon.'); }
  }
}

function selectPayment(method) {  if (method === 'iyzico') return; // henüz aktif değil
  selectedPayment = method;
  document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
  document.getElementById('pm-' + method).classList.add('selected');
  document.getElementById('iyzicoNote').style.display = method === 'iyzico' ? 'block' : 'none';
}

async function placeOrder() {
  const btn = document.getElementById('placeOrderBtn');
  // Validasyon
  let address, city, phone, district, zip;
  const note = document.getElementById('order_note')?.value?.trim() || '';

  if (selectedAddressId) {
    // Kayıtlı adres kullan
    const sel = savedAddresses.find(a => a.id === selectedAddressId);
    if (!sel) { showToast('Lütfen bir teslimat adresi seçin.', 'error'); return; }
    address = sel.address; city = sel.city; phone = sel.phone;
    district = sel.district; zip = sel.zip;
    // Ad bilgisini order için
    document.getElementById('addr_name') && (document.getElementById('addr_name').value = sel.name);
  } else {
    // Yeni adres formu
    address  = document.getElementById('addr_address')?.value?.trim() || '';
    city     = document.getElementById('addr_city')?.value?.trim() || '';
    phone    = document.getElementById('addr_phone')?.value?.trim() || '';
    district = document.getElementById('addr_district')?.value?.trim() || '';
    zip      = document.getElementById('addr_zip')?.value?.trim() || '';
    if (!address || !city || !phone) {
      showToast('Adres, şehir ve telefon zorunludur.', 'error'); return;
    }
    // Kaydet seçeneği işaretliyse kaydet
    if (document.getElementById('saveNewAddr')?.checked && currentUser) {
      fetch('/api/addresses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Adresim', name: currentUser.name, phone, address, city, district, zip })
      }).catch(() => {});
    }
  }

  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> Sipariş Veriliyor...';

  const res  = await fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ address, city, district, zip, phone, note, couponCode: appliedCouponCode || undefined })
  });
  const data = await res.json();

  if (data.success) {
    window.location.href = `/siparis-basarili?no=${data.order.orderNo}`;
  } else {
    showToast(data.error || 'Sipariş oluşturulamadı.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<span>✅</span> Siparişi Onayla';
  }
}

function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = '<span>' + (type==='success'?'✅':type==='error'?'❌':'ℹ️') + '</span> ' + msg;
  c.appendChild(t); setTimeout(() => t.remove(), 3500);
}

initCheckout();
